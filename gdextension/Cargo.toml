# ── GDExtension crate ─────────────────────────────────────────────────────────
# Single crate — no workspace. Domain modules live directly in src/:
#   src/rsapi.rs            — PSARC/BNK/WEM/SNG parsing
#   src/q_engine.rs         — Godot QEngine (AudioEffectCapture -> cycfi/q)
#   src/rocksmith_bridge.rs — Godot RocksmithBridge class
#   src/audio_engine.rs     — Godot AudioEngine class (vgmstream WEM decode)
[package]
name    = "godot_goguitar_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Godot integration
godot            = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-4"] }
# Rocksmith 2014 PSARC/SNG parsing (pure Rust, no .NET) vendored as extern subproject.
rocksmith2014-psarc = { path = "extern/Rocksmith2014.rs/rocksmith2014-psarc" }
rocksmith2014-sng   = { path = "extern/Rocksmith2014.rs/rocksmith2014-sng" }

[dev-dependencies]
godot_qengine_rs = { path = "../gdextension_qengine" }
